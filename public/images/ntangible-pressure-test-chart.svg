<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Headline findings: an estimated nine in ten NCAA institutions have no embedded mental performance capability, only 25.7 percent of Division I departments embed any provider, only 23 percent of those providers do mental performance work, and 6.7 percent of athletes attend campus counseling in a year.">
<rect width="1200" height="400" fill="#FBFAF8"/>
<text x="60" y="58" font-family="'Roboto Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="3.2" fill="#6F6C64">THE PRESSURE TEST &#183; NTANGIBLE WHITEPAPER &#183; SEPTEMBER 2026</text>
<line x1="60" y1="88" x2="1140" y2="88" stroke="#0E0E0E" stroke-width="2"/>
<text x="94.0" y="205" font-family="'Roboto Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="62" font-weight="500" fill="#0E0E0E">~90%</text>
<text x="94.0" y="250" font-size="17" fill="#42403B">of NCAA institutions have</text>
<text x="94.0" y="275" font-size="17" fill="#42403B">no embedded mental</text>
<text x="94.0" y="300" font-size="17" fill="#42403B">performance capability</text>
<text x="94.0" y="325" font-size="17" fill="#42403B">(author’s estimate)</text>
<line x1="330.0" y1="112" x2="330.0" y2="344" stroke="#D8D4CC" stroke-width="1"/>
<text x="364.0" y="205" font-family="'Roboto Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="62" font-weight="500" fill="#0E0E0E">25.7%</text>
<text x="364.0" y="250" font-size="17" fill="#42403B">of Division I departments</text>
<text x="364.0" y="275" font-size="17" fill="#42403B">embed any provider at all,</text>
<text x="364.0" y="300" font-size="17" fill="#42403B">and it thins to near zero</text>
<text x="364.0" y="325" font-size="17" fill="#42403B">below Division I</text>
<line x1="600.0" y1="112" x2="600.0" y2="344" stroke="#D8D4CC" stroke-width="1"/>
<text x="634.0" y="205" font-family="'Roboto Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="62" font-weight="500" fill="#0E0E0E">23%</text>
<text x="634.0" y="250" font-size="17" fill="#42403B">of those embedded</text>
<text x="634.0" y="275" font-size="17" fill="#42403B">providers do mental</text>
<text x="634.0" y="300" font-size="17" fill="#42403B">performance work; the rest</text>
<text x="634.0" y="325" font-size="17" fill="#42403B">are clinicians</text>
<line x1="870.0" y1="112" x2="870.0" y2="344" stroke="#D8D4CC" stroke-width="1"/>
<text x="904.0" y="205" font-family="'Roboto Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="62" font-weight="500" fill="#0E0E0E">6.7%</text>
<text x="904.0" y="250" font-size="17" fill="#42403B">of athletes attend campus</text>
<text x="904.0" y="275" font-size="17" fill="#42403B">counseling in a year, so</text>
<text x="904.0" y="300" font-size="17" fill="#42403B">waiting for raised hands</text>
<text x="904.0" y="325" font-size="17" fill="#42403B">is not a plan</text>
<line x1="60" y1="360" x2="1140" y2="360" stroke="#E6E3DD" stroke-width="1"/>
</svg>